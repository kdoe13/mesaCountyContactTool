name: Scrape contacts
on:
  schedule:
    - cron: '0 13 * * 1'   # Mondays ~7am Mountain
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - name: Scrape
        id: scrape
        run: node scraper/scrape.js 2> scrape-errors.txt || echo "failed=true" >> "$GITHUB_OUTPUT"
      - name: Open or update issue on scrape failure
        if: steps.scrape.outputs.failed == 'true'
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          gh label create scrape-failure --color ee0701 --description "Scheduled scrape failed validation" 2>/dev/null || true
          body="$(printf 'Scrape failure on %s; live data was left untouched.\n\n```\n%s\n```' "$(date -u +%F)" "$(cat scrape-errors.txt)")"
          existing="$(gh issue list --label scrape-failure --state open --json number --jq '.[0].number // empty' 2>/dev/null || true)"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body" || true
          else
            gh issue create --title "Scheduled scrape is failing" --body "$body" --label scrape-failure || true
          fi
      - name: Build PR body
        id: diff
        run: |
          node scraper/diff-summary.js > pr-body.md
          if git diff --quiet -- data/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # A real diff in data/ ALWAYS gets a PR. If the plain-English summary
          # can't account for it, say so in the body rather than throwing the
          # change away (which used to happen silently, with no PR and no issue).
          if ! grep -q '^- ' pr-body.md; then
            printf '\n**Note:** changes were detected in `data/` that the summary does not describe (for example a field the summary does not track). Review the file diff directly.\n' >> pr-body.md
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Open PR with changes
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          add-paths: data/
          branch: scrape-updates
          title: 'Contact data updates from scheduled scrape'
          body-path: pr-body.md
          commit-message: 'chore: scraped contact data update'
